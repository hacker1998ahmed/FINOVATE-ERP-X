<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات الذكاء الاصطناعي - FINOVATE ERP X</title>
    <link rel="stylesheet" href="css/core.css">
    <link rel="stylesheet" href="css/ai-settings.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 إعدادات الذكاء الاصطناعي</h1>
            <p>FINOVATE AI Assistant - Multi-Provider System</p>
        </header>

        <div id="ai-settings-container" class="ai-settings">
            <!-- Settings will be rendered here by JavaScript -->
        </div>

        <div style="margin-top: 30px; text-align: center;">
            <a href="index.html" class="btn-primary">العودة للرئيسية</a>
        </div>
    </div>

    <script src="js/ai-assistant.js"></script>
    <script>
        // Initialize AI settings when page loads
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof FinovateAIInstance === 'undefined') {
                FinovateAIInstance = new FinovateAI();
                FinovateAIInstance.loadPreferences();
            }
            
            const container = document.getElementById('ai-settings-container');
            FinovateAIInstance.renderSettingsUI(container);
        });
    </script>
</body>
</html>
