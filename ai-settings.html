<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات الذكاء الاصطناعي - FINOVATE ERP X</title>
    <link rel="stylesheet" href="css/core.css">
    <link rel="stylesheet" href="css/ai-settings.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 إعدادات الذكاء الاصطناعي</h1>
            <p>FINOVATE AI Assistant - Multi-Provider System</p>
        </header>

        <div style="margin-bottom: 20px;">
            <select id="language-toggle" aria-label="Switch language"></select>
        </div>

        <div id="ai-settings-container" class="ai-settings">
            <!-- Settings will be rendered here by JavaScript -->
        </div>

        <div style="margin-top: 30px; text-align: center;">
            <a href="index.html" class="btn-primary">العودة للرئيسية</a>
        </div>
    </div>

    <script src="js/localization.js"></script>
    <script src="js/ai-assistant.js"></script>
    <script>
        // Initialize AI settings when page loads
        document.addEventListener('DOMContentLoaded', function() {
            // Populate language selector first
            if (document.getElementById('language-toggle')) {
                populateLanguageSelector();
                setLanguage(localStorage.getItem('finovate-language') || 'ar');
            }
            
            // Wait for FinovateAI instance to be created
            setTimeout(function() {
                const container = document.getElementById('ai-settings-container');
                if (window.FinovateAIInstance && container) {
                    window.FinovateAIInstance.loadPreferences();
                    window.FinovateAIInstance.renderSettingsUI(container);
                } else {
                    console.error('FinovateAI instance not found or container missing');
                }
            }, 100);
        });
    </script>
</body>
</html>
